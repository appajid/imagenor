[package]
name = "imagenor-cli"
description = "Headless Imagenor: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional imagenor-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["imagenor-codecs/heif"]

[lints]
workspace = true

[lib]
name = "imagenor_cli"
path = "src/lib.rs"

[[bin]]
name = "imagenor-cli"
path = "src/main.rs"

[dependencies]
imagenor-automation = { path = "../../crates/automation" }
imagenor-engine = { workspace = true }
imagenor-io = { workspace = true }
imagenor-format = { path = "../../crates/format" }
imagenor-codecs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Synthetic camera raws (#7789).
imagenor-raw = { workspace = true, features = ["testgen"] }
# Shell completions and man pages (examples/man-and-completions.rs, for the packages); not in
# the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for imagenor-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

