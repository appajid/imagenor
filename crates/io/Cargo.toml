[package]
name = "imagenor-io"
description = "Import/export between imagenor documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to imagenor-codecs; see its `heif` feature).
heif = ["imagenor-codecs/heif"]

[dependencies]
imagenor-geom = { workspace = true }
imagenor-color = { workspace = true }
imagenor-cms = { workspace = true }
imagenor-raster = { workspace = true }
imagenor-doc = { workspace = true }
imagenor-compose = { workspace = true }
imagenor-algo = { workspace = true }
imagenor-psd = { workspace = true }
imagenor-codecs = { workspace = true }
imagenor-raw = { workspace = true }
imagenor-affinity = { workspace = true }
imagenor-text = { workspace = true }
imagenor-paint = { workspace = true }
imagenor-vector = { workspace = true }
imagenor-format = { path = "../format" }
craft-docpath = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.21"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
crc32fast = "1.5"
imagenor-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
imagenor-psd = { workspace = true, features = ["testgen"] }
imagenor-raw = { workspace = true, features = ["testgen"] }
imagenor-testkit = { workspace = true }
proptest = { workspace = true }
