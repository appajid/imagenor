name: Full quality checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      IMAGENOR_NO_PRINT: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy && rustup target add wasm32-unknown-unknown
      - name: Run complete quality gate
        run: cargo xtask ci
